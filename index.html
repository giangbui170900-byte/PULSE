const G={A:&quot;Giới thiệu bản thân&quot;,B:&quot;Kinh nghiệm&quot;,C:&quot;Tình huống chuyên môn&quot;,D:&quot;Thái độ và khả năng làm việc&quot;,E:&quot;Câu hỏi dành cho nhà tuyển dụng&quot;,F:&quot;Câu hỏi khó HR có thể hỏi&quot;};
const D=[
[&quot;A&quot;,&quot;Hãy giới thiệu về bản thân.&quot;,&quot;Em chào anh/chị, em là Bùi Quỳnh Giang, vừa hoàn tất chương trình Logistics và Quản lý Chuỗi cung ứng tại Đại học Giao thông Vận tải TP.HCM, GPA 3.74/4.0, hiện đang chờ bằng tốt nghiệp. Năm 2025 em học thêm khóa Xuất nhập khẩu và Logistics ở Tân Minh Trí. Từ 18/08 đến 15/11/2026 em thực tập chăm sóc khách hàng tại J&amp;T Express, kiểm tra trọng lượng thực tế so với khai báo trên JMS, mỗi ngày xử lý tối thiểu 2.000 đơn. Em cẩn thận với số liệu và muốn phát triển ở mảng kho và hậu cần.&quot;],
[&quot;A&quot;,&quot;Tại sao bạn ứng tuyển vị trí này?&quot;,&quot;Em học Logistics nên muốn làm đúng chuyên ngành, và em thấy kho cùng hậu cần sự kiện là nơi em có thể học nhanh nhất. Ở J&amp;T, việc của em là đối chiếu số liệu, tìm chênh lệch và phối hợp xử lý, nên em quen với sự chính xác. Em chưa có kinh nghiệm kho trực tiếp, nhưng em muốn bắt đầu từ vị trí này và được đào tạo bài bản.&quot;],
[&quot;A&quot;,&quot;Tại sao bạn chọn PULSE?&quot;,&quot;Em thấy PULSE vừa thương mại vừa sản xuất, nên công việc kho và hậu cần có nhiều tình huống thực tế để học. Vị trí này kết hợp quản lý hàng hóa với hậu cần sự kiện, đòi hỏi cẩn thận và phối hợp nhiều bên, đúng với điểm mạnh của em. Em cũng muốn hiểu thêm về định hướng của công ty để làm việc cho phù hợp.&quot;,&quot;Trước buổi phỏng vấn, hãy đọc website/fanpage PULSE và thêm 1–2 chi tiết thật về sản phẩm hoặc sự kiện của công ty.&quot;],
[&quot;B&quot;,&quot;Công việc tại J&amp;T có liên quan gì đến vị trí này?&quot;,&quot;Ở J&amp;T em kiểm tra trọng lượng thực tế với thông tin khai báo trên JMS, ghi nhận phạt trọng lượng cho bưu cục (trung bình 150 đơn mỗi ngày) và tổng hợp, đối chiếu dữ liệu trên Feishu Sheets. Công việc kho cũng cần so số thực tế với chứng từ, nên kỹ năng kiểm tra, đối chiếu và báo cáo chênh lệch của em dùng được. Em cũng quen liên hệ khách hàng và phối hợp bộ phận khác khi có phát sinh. Em hiểu đây chưa phải công việc kho, nhưng là nền tảng cho nó.&quot;],
[&quot;B&quot;,&quot;Bạn đã từng làm quản lý kho chưa?&quot;,&quot;Dạ chưa, em chưa từng quản lý kho. Em có kiến thức về chuỗi cung ứng từ trường và khóa học, cùng kinh nghiệm kiểm tra và đối chiếu số liệu ở J&amp;T. Em sẽ học quy trình nhập, xuất, kiểm kê của công ty từ những việc cơ bản và hỏi khi chưa chắc để tránh sai sót.&quot;],
[&quot;B&quot;,&quot;Bạn có kinh nghiệm tổ chức sự kiện không?&quot;,&quot;Dạ em chưa có kinh nghiệm tổ chức sự kiện. Em muốn nói rõ như vậy để anh/chị đánh giá đúng. Điều em có là sự cẩn thận, khả năng phối hợp và tinh thần học hỏi. Em sẵn sàng đi theo anh chị trong các sự kiện đầu để nắm quy trình chuẩn bị, vận chuyển và thu hồi hàng.&quot;],
[&quot;C&quot;,&quot;Số lượng hàng thực tế không khớp phiếu xuất kho thì xử lý thế nào?&quot;,&quot;Em sẽ đếm lại ít nhất một lần, có thể nhờ người thứ hai kiểm cùng. Nếu vẫn lệch, em ghi rõ mã hàng, số theo phiếu, số thực tế và chênh lệch, rồi báo ngay người phụ trách để xử lý trước khi hàng đi. Em không tự sửa phiếu. Cách này giống việc em đối chiếu trọng lượng với dữ liệu khai báo ở J&amp;T: thấy lệch thì ghi nhận và báo đúng người.&quot;],
[&quot;C&quot;,&quot;Hàng hóa bị hư hỏng trước sự kiện thì xử lý ra sao?&quot;,&quot;Trước tiên em chụp ảnh và ghi nhận số lượng, tình trạng hư hỏng, rồi báo ngay quản lý để biết còn kịp thay thế hay không. Em tách riêng hàng lỗi để không lẫn vào hàng tốt, rồi hỗ trợ kiểm tra lại số hàng còn lại. Việc liên hệ nhà cung cấp hay đổi hàng em sẽ làm theo hướng dẫn của quản lý.&quot;],
[&quot;C&quot;,&quot;Nhiều đơn hàng cần chuẩn bị cùng lúc thì sắp xếp thế nào?&quot;,&quot;Em liệt kê tất cả đơn, sắp theo thời hạn giao và mức độ quan trọng, rồi hỏi quản lý nếu hai việc cùng gấp. Em chia việc thành các bước: lấy hàng, kiểm, đóng gói, dán nhãn và có bảng theo dõi tiến độ. Ở J&amp;T em quen xử lý số lượng lớn mỗi ngày nên em chú ý làm có hệ thống, không làm vội dễ sót.&quot;],
[&quot;C&quot;,&quot;Hàng hóa sau sự kiện bị thiếu thì xử lý ra sao?&quot;,&quot;Em đối chiếu danh sách hàng xuất đi với hàng nhận về để biết chính xác thiếu gì, bao nhiêu. Sau đó em hỏi lại các bộ phận hoặc người đã nhận hàng xem có để sót ở địa điểm hay chưa bàn giao không. Nếu vẫn thiếu, em báo quản lý kèm bảng chênh lệch để quyết định xử lý. Em cũng đề xuất kiểm đếm có ký nhận ở cả hai chiều cho các sự kiện sau.&quot;],
[&quot;C&quot;,&quot;Nhà cung cấp báo giá cao hơn ngân sách thì làm gì?&quot;,&quot;Em sẽ báo quản lý trước, không tự quyết. Sau đó em so báo giá với ít nhất hai nhà cung cấp khác, xem lại điều kiện như số lượng, thời gian giao, vận chuyển. Em có thể đề nghị nhà cung cấp điều chỉnh giá hoặc đổi quy cách. Em đang học phần này, nên rất mong được anh chị hướng dẫn cách PULSE làm việc với nhà cung cấp.&quot;],
[&quot;D&quot;,&quot;Điểm mạnh của bạn?&quot;,&quot;Em cẩn thận với số liệu. Ở J&amp;T em kiểm tra tối thiểu 2.000 đơn mỗi ngày và đối chiếu dữ liệu trên Feishu Sheets, nên em quen soát lại để giảm sai sót. Em cũng trung thực: có lỗi thì báo sớm. Ngoài ra em chủ động học, như khóa Xuất nhập khẩu và Logistics em tự đăng ký.&quot;],
[&quot;D&quot;,&quot;Điểm yếu của bạn?&quot;,&quot;Em chưa có kinh nghiệm kho thực tế và chưa quen thao tác bốc xếp, nên lúc đầu có thể chậm hơn người đã làm. Em xử lý bằng cách hỏi kỹ quy trình, ghi chép và luyện tập. Em cũng đôi khi quá kỹ với số liệu nên mất thời gian, em đang tập đặt ra thời hạn cho từng việc.&quot;],
[&quot;D&quot;,&quot;Có sẵn sàng tăng ca hoặc làm cuối tuần khi có sự kiện không?&quot;,&quot;Dạ em hiểu đặc thù sự kiện là có lúc phải làm ngoài giờ hoặc cuối tuần, và em sẵn sàng sắp xếp. Em chỉ mong được biết trước lịch sớm để chuẩn bị, và hỏi thêm công ty tính tăng ca hay nghỉ bù thế nào.&quot;],
[&quot;D&quot;,&quot;Khi nào có thể bắt đầu làm việc?&quot;,&quot;Kỳ thực tập của em tại J&amp;T kết thúc ngày 15/11/2026 nên em có thể bắt đầu sau ngày đó. Nếu công ty cần sớm hơn, em xin trao đổi để sắp xếp bàn giao ổn thỏa.&quot;],
[&quot;E&quot;,&quot;Công việc chủ yếu tại kho hay địa điểm sự kiện?&quot;,&quot;Em muốn biết tỷ lệ thời gian giữa làm việc tại kho và ở địa điểm sự kiện để chuẩn bị sức khỏe và phương tiện đi lại phù hợp.&quot;,&quot;Có thể hỏi nguyên văn câu trên.&quot;],
[&quot;E&quot;,&quot;Nhân viên mới được đào tạo những quy trình nào?&quot;,&quot;Em muốn hiểu lộ trình đào tạo ban đầu, như nhập xuất, kiểm kê, phần mềm quản lý, để biết cần chuẩn bị gì.&quot;],
[&quot;E&quot;,&quot;Công việc kho và hậu cần sự kiện được phân chia ra sao?&quot;,&quot;Em muốn biết công việc hằng tuần là kho nhiều hơn hay sự kiện nhiều hơn, và ai sẽ hướng dẫn trực tiếp em.&quot;],
[&quot;E&quot;,&quot;Có phụ cấp khi làm ngoài giờ hoặc cuối tuần không?&quot;,&quot;Em muốn hỏi rõ chính sách tăng ca và làm cuối tuần cho sự kiện: tính tiền hay nghỉ bù, để em có kế hoạch phù hợp.&quot;],
[&quot;E&quot;,&quot;Công ty đánh giá hiệu quả công việc theo tiêu chí nào?&quot;,&quot;Em muốn biết ở vị trí này công ty đánh giá điều gì là tốt, như độ chính xác kiểm kê hay đúng tiến độ, để em tập trung đúng hướng ngay từ đầu.&quot;],
[&quot;F&quot;,&quot;Bạn chưa có kinh nghiệm kho và sự kiện, vì sao tôi nên chọn bạn?&quot;,&quot;Em không có kinh nghiệm kho hay sự kiện, và em không muốn nói quá. Điều em có là nền tảng Logistics, GPA 3.74, kinh nghiệm đối chiếu hàng nghìn đơn mỗi ngày ở J&amp;T, và sự cẩn thận khi làm việc với số liệu. Công ty nhận ứng viên chưa có kinh nghiệm và đào tạo, nên em xin cơ hội chứng minh bằng sự chăm chỉ và học nhanh.&quot;],
[&quot;F&quot;,&quot;Công việc kho có thể nặng và vất vả. Bạn có chịu được không?&quot;,&quot;Em hiểu có lúc phải bốc xếp, đứng nhiều và làm gấp. Em chưa làm kho nên chưa dám nói là quen, nhưng em sẵn sàng thích nghi, làm theo hướng dẫn an toàn và nhờ đồng nghiệp chỉ cách làm đúng. Em cũng sẽ giữ sức khỏe để không ảnh hưởng tiến độ chung.&quot;],
[&quot;F&quot;,&quot;Bạn làm sai số liệu một lần thì sao? Bạn đã từng sai chưa?&quot;,&quot;Ai làm việc với số liệu nhiều cũng có lúc sai. Khi em phát hiện sai, em báo người phụ trách ngay, sửa lại và kiểm lại phần liên quan. Em đối chiếu thêm một lượt trước khi gửi để hạn chế lặp lại. Em nghĩ quan trọng là trung thực và sửa nhanh, không giấu.&quot;],
[&quot;F&quot;,&quot;Bạn dự định gắn bó bao lâu và định hướng của bạn là gì?&quot;,&quot;Em muốn làm ổn định ít nhất vài năm để học vững kho và hậu cần. Trước mắt em tập trung hoàn thành tốt công việc, sau đó học thêm về lập kế hoạch tồn kho và làm việc với nhà cung cấp, vì đó cũng là phần của vị trí này.&quot;]
];

&lt;header&gt;&lt;h1&gt;Thương lượng lương – Nhân viên Logistics Sự kiện và Kho, PULSE&lt;/h1&gt;&lt;p&gt;Bùi Quỳnh Giang · Bộ công cụ chuẩn bị trước khi trao đổi offer&lt;/p&gt;&lt;/header&gt;
&lt;main&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Lưu ý:&lt;/b&gt; khoảng lương dưới đây là mức Giang tự đề xuất để chuẩn bị, &lt;b&gt;không phải mức lương đã xác minh của PULSE&lt;/b&gt;. Hãy xác nhận ngân sách thực tế với nhà tuyển dụng.&lt;/div&gt;
&lt;div class=&quot;k&quot;&gt;&lt;div&gt;&lt;b&gt;8–9 triệu&lt;/b&gt;&lt;span&gt;Khoảng đề xuất, gross/tháng&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;8.500.000 đ&lt;/b&gt;&lt;span&gt;Mức kỳ vọng ban đầu, gross/tháng&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h2&gt;Các tình huống thương lượng&lt;/h2&gt;&lt;div id=&quot;sc&quot;&gt;&lt;/div&gt;

&lt;h2&gt;So sánh nhanh các mức HR đề xuất&lt;/h2&gt;
&lt;div class=&quot;w&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;HR đề xuất&lt;/th&gt;&lt;th&gt;Hướng xử lý&lt;/th&gt;&lt;th&gt;Điều cần hỏi&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7 triệu&lt;/td&gt;&lt;td&gt;Chưa nhận ngay, hỏi tổng thu nhập&lt;/td&gt;&lt;td&gt;Gross/net, phụ cấp, tăng ca, di chuyển&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7,5 triệu&lt;/td&gt;&lt;td&gt;Gần kỳ vọng, thương lượng lộ trình tăng&lt;/td&gt;&lt;td&gt;Tiêu chí đánh giá và điều chỉnh sau thử việc&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;8 triệu&lt;/td&gt;&lt;td&gt;Trong khoảng mong muốn, xác nhận chi tiết&lt;/td&gt;&lt;td&gt;Gross/net, thử việc, BHXH, phúc lợi&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;w&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Nội dung&lt;/th&gt;&lt;th&gt;Thông tin cần xác nhận&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Lương&lt;/td&gt;&lt;td&gt;Gross hay net?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Thử việc&lt;/td&gt;&lt;td&gt;Thời gian và mức hưởng?&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;Sự kiện&lt;/td&gt;&lt;td&gt;Có phụ cấp cuối tuần và ngoài giờ?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Công tác&lt;/td&gt;&lt;td&gt;Có hỗ trợ chi phí di chuyển?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;BHXH&lt;/td&gt;&lt;td&gt;Thời điểm tham gia?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Đánh giá&lt;/td&gt;&lt;td&gt;Bao lâu xem xét điều chỉnh lương?&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h2&gt;Khi chưa có kinh nghiệm trực tiếp&lt;/h2&gt;
&lt;div class=&quot;card&quot;&gt;&lt;ul&gt;
&lt;li&gt;Nói thẳng điều chưa có, rồi nêu ngay điều đã làm: kiểm tra, đối chiếu dữ liệu đơn hàng tại J&amp;amp;T.&lt;/li&gt;
&lt;li&gt;Đưa khoảng lương (8–9 triệu) thay vì một con số cố định.&lt;/li&gt;
&lt;li&gt;Nếu bị trả thấp hơn, xin lộ trình: đánh giá sau thử việc, phụ cấp, hoặc đào tạo.&lt;/li&gt;
&lt;li&gt;Dùng dữ kiện thật (GPA 3.74, 2.000 đơn/ngày, khóa học 2025), không nói quá.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

&lt;li&gt;So sánh lương với người khác hoặc nói về áp lực tiền bạc cá nhân.&lt;/li&gt;
&lt;li&gt;Từ chối cứng ngay trong buổi phỏng vấn, thay vì xin thời gian cân nhắc.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

&lt;h2&gt;Checklist đánh giá offer&lt;/h2&gt;
&lt;div class=&quot;card&quot; id=&quot;ck&quot;&gt;&lt;/div&gt;

&lt;h2&gt;Mẫu tin nhắn phản hồi offer sau phỏng vấn&lt;/h2&gt;
&lt;div class=&quot;card&quot;&gt;&lt;textarea id=&quot;tp&quot; aria-label=&quot;Mẫu tin nhắn&quot;&gt;Chào anh/chị [tên HR],

Em là Bùi Quỳnh Giang. Em cảm ơn anh/chị và PULSE đã dành thời gian phỏng vấn và gửi đề xuất cho vị trí Nhân viên Logistics Sự kiện và Kho.

Em rất quan tâm đến vị trí này. Để em xác nhận chính xác, anh/chị cho em hỏi thêm về: mức lương là gross hay net, chế độ thử việc, phụ cấp, chính sách tăng ca và làm cuối tuần cho sự kiện, thời điểm đóng BHXH, và thời gian đánh giá điều chỉnh lương.

Em xin phép phản hồi chính thức trong vòng [số] ngày sau khi nhận thông tin. Em cảm ơn anh/chị.

Trân trọng,
Bùi Quỳnh Giang&lt;/textarea&gt;&lt;p&gt;&lt;button onclick=&quot;cpt($(&#x27;#tp&#x27;).value,this)&quot;&gt;Sao chép tin nhắn&lt;/button&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/main&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const SC=[
[&quot;Tình huống 1: HR hỏi mức lương mong muốn&quot;,&quot;Anh/chị mong muốn mức lương bao nhiêu?&quot;,&quot;Dạ, với vị trí này em mong muốn khoảng 8 đến 9 triệu gross mỗi tháng. Em hiểu mình chưa có kinh nghiệm kho trực tiếp nên em cũng linh hoạt, và quan tâm đến cơ hội đào tạo và lộ trình phát triển. Em mong được biết ngân sách của công ty cho vị trí này để trao đổi thêm.&quot;,&quot;Đưa khoảng, không đưa một con số cố định. Mức 8.500.000 đ là điểm xuất phát của Giang.&quot;],
[&quot;Tình huống 2: HR đề xuất 7 triệu&quot;,&quot;Công ty có thể đề xuất 7 triệu.&quot;,&quot;Dạ em cảm ơn anh/chị. Trước khi phản hồi, em muốn hiểu rõ tổng thu nhập: 7 triệu là gross hay net, đã gồm phụ cấp chưa? Khi làm ngoài giờ hoặc cuối tuần cho sự kiện thì tính tăng ca hay nghỉ bù, và công ty có hỗ trợ di chuyển, ăn uống không? Nếu 7 triệu là mức cố định, em mong được cân nhắc thêm phụ cấp hoặc lộ trình xem xét lại lương sau thử việc.&quot;,&quot;Hỏi toàn bộ khoản ngoài lương cơ bản trước khi đồng ý hay từ chối.&quot;],
[&quot;Tình huống 3: HR đề xuất 7,5 triệu&quot;,&quot;Mức 7,5 triệu thì sao?&quot;,&quot;Dạ mức này gần với kỳ vọng của em. Em muốn hỏi thêm: công ty đánh giá sau thử việc theo tiêu chí nào, và nếu đạt thì lương được điều chỉnh khi nào, khoảng bao nhiêu? Nếu có thể ghi rõ lộ trình điều chỉnh trong thư mời nhận việc, em sẵn sàng xác nhận.&quot;,&quot;Tập trung vào đánh giá và điều chỉnh sau thử việc, không ép nâng ngay.&quot;],
[&quot;Tình huống 4: HR đề xuất 8 triệu&quot;,&quot;Công ty đề xuất 8 triệu, bạn thấy thế nào?&quot;,&quot;Dạ em cảm ơn anh/chị, mức 8 triệu nằm trong khoảng em mong muốn. Để em xác nhận chính xác, anh/chị cho em hỏi mức này là gross hay net, mức lương và thời gian thử việc, thời điểm đóng BHXH, cùng các khoản phúc lợi như phụ cấp, tăng ca, công tác. Sau khi có thư mời, em xin xác nhận.&quot;,&quot;Xác nhận bằng văn bản (email/thư mời) trước khi chấp nhận.&quot;],
[&quot;Tình huống 5: HR hỏi tại sao bạn xứng đáng với mức lương này&quot;,&quot;Tại sao chúng tôi nên trả mức lương này cho bạn?&quot;,&quot;Dạ, em học đúng chuyên ngành Logistics và Quản lý Chuỗi cung ứng với GPA 3.74/4.0. Tại J&amp;T, em kiểm tra trọng lượng, đối chiếu dữ liệu đơn hàng và xử lý tối thiểu 2.000 đơn mỗi ngày nên em quen với việc kiểm tra thông tin chính xác. Em cũng chủ động học thêm, như khóa Xuất nhập khẩu và Logistics. Em chưa có kinh nghiệm kho thực tế, nhưng em tin sự cẩn thận và học nhanh sẽ giúp em đóng góp sớm.&quot;,&quot;Không nói quá. Nêu đúng điều đã làm, thừa nhận điều chưa có.&quot;]];
$(&#x27;#sc&#x27;).innerHTML=SC.map((s,i)=&gt;`&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;${s[0]}&lt;/h3&gt;&lt;p class=&quot;hr&quot;&gt;&lt;b&gt;HR:&lt;/b&gt; ${s[1]}&lt;/p&gt;&lt;p class=&quot;me&quot; id=&quot;m${i}&quot;&gt;&lt;b&gt;Giang:&lt;/b&gt; ${s[2]}&lt;/p&gt;&lt;p class=&quot;nt&quot;&gt;Gợi ý: ${s[3]}&lt;/p&gt;&lt;button onclick=&quot;cpt(SC[${i}][2],this)&quot;&gt;Sao chép câu trả lời&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
function cpt(t,b){const ok=()=&gt;{const o=b.textContent;b.textContent=&#x27;Đã sao chép&#x27;;setTimeout(()=&gt;b.textContent=o,1500)};
if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=&gt;fb(t,ok));else fb(t,ok)}
function fb(t,ok){const a=document.createElement(&#x27;textarea&#x27;);a.value=t;document.body.appendChild(a);a.select();try{document.execCommand(&#x27;copy&#x27;);ok()}catch(e){}a.remove()}
const CK=[&quot;Đã xác nhận lương là gross hay net&quot;,&quot;Đã biết thời gian và mức lương thử việc&quot;,&quot;Đã rõ các khoản phụ cấp (ăn uống, gửi xe, điện thoại, di chuyển)&quot;,&quot;Đã rõ chính sách tăng ca: tính tiền hay nghỉ bù&quot;,&quot;Đã rõ phụ cấp làm cuối tuần và ngoài giờ cho sự kiện&quot;,&quot;Đã rõ hỗ trợ chi phí công tác&quot;,&quot;Đã biết thời điểm đóng BHXH&quot;,&quot;Đã biết bao lâu xem xét điều chỉnh lương&quot;,&quot;Đã rõ mô tả công việc: tỷ lệ kho và sự kiện&quot;,&quot;Đã nhận offer bằng văn bản (email hoặc thư mời)&quot;];
let C;try{C=JSON.parse(localStorage.getItem(&#x27;pck&#x27;))||{}}catch(e){C={}}

function tk(i,v){C[i]=v;try{localStorage.setItem(&#x27;pck&#x27;,JSON.stringify(C))}catch(e){}cn()}
